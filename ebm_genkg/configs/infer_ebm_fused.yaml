# run with:
# python scripts/run_infer.py --config configs/infer_ebm_fused.yaml
#
# NOTE:
# This config uses your fused V2 JSON as input.

in_json: /home/code/3Ddetection/IS-Fusion/GenKG/ebm_genkg/model/late_fusion/output/V2/sorted_by_scene_ISFUSIONandGTattr_val_3_modality_aligned_fused_candidates.json
out_json: /home/code/3Ddetection/IS-Fusion/GenKG/ebm_genkg/experiments/tmp/out_refined_fused.json

limit_scenes: null
log_every_scenes: 10
require_gt: false

# Candidate generation:
# fused det already contains merged candidates, avoid adding warp again at first.
use_warp: false
warp_radius: 2
warp_topk: 200
warp_decay: 0.9
raw_score_min: 0.0
max_per_frame: 260
ignore_classes: "-1"

# inference backend
backend: ebm
use_sources: all
keep_thr: 0.25
nms_thr: 1.2
topk: 260
include_sources: true

# ebm runtime kwargs (same baseline as infer_ebm.yaml)
ebm_energy_mode: four_term
ebm_energy_select_margin: 0.15
ebm_energy_prob_gate: 0.0
ebm_energy_local_refine: true
ebm_energy_local_refine_rounds: 2
ebm_w_keep: 1.0
ebm_w_pair: 0.90
ebm_enable_learned_pair: true
ebm_hard_nms: false
ebm_prefilter_topm_seed: 500
ebm_prefilter_topm_fill: 700
ebm_enable_label_vote: false
ebm_w_attr: 0.02
ebm_enable_overlap_soft: true
ebm_overlap_min_ratio: 0.10
ebm_overlap_soft_scale: 0.80
ebm_enable_temporal_pair: true
ebm_temporal_pair_radius: 1.5
ebm_temporal_pair_bonus: 0.30
ebm_temporal_pair_warp_only: true
ebm_soft_dt_support: true
ebm_dt_shortfall_penalty: 0.05
ebm_enable_context_density: true
ebm_context_cell_xy: 1.0
ebm_context_min_density: 2
ebm_context_shortfall_penalty: 0.03
ebm_context_warp_only: true
ebm_unary_use_learned: true
ebm_unary_ckpt_path: null
ebm_use_learned_class: true
ebm_learned_class_min_prob: 0.55
ebm_use_learned_attr: true
ebm_learned_attr_min_prob: 0.50
ebm_dual_head_solver: true
ebm_dual_head_unified_context: false
ebm_keep_head_raw_bias: 0.20
ebm_keep_head_nonraw_bias: -0.80
ebm_add_head_warp_bias: 0.10
ebm_add_head_nonwarp_bias: -3.0
ebm_add_head_support_gain: 0.10
ebm_add_head_potential_gain: 0.45
ebm_add_head_class_gain: 0.25
ebm_stage_a_keep_thr: 0.25
ebm_stage_b_add_thr: 0.45
ebm_stage_b_min_potential_dist: 1.2
ebm_stage_b_min_potential: 0.40
ebm_stage_b_min_class_conf: 0.80
ebm_stage_b_enforce_class_conf: true
ebm_stage_c_attr_scale: 0.20
ebm_stage_c_rel_scale: 0.20
ebm_recall_backfill_enabled: false
ebm_recall_backfill_min_keep_prob: 0.60
ebm_recall_backfill_min_per_frame: 0
ebm_recall_backfill_raw_ratio: 0.25
ebm_recall_backfill_pair_guard_scale: 0.90
ebm_recall_backfill_min_class_conf: 0.80
ebm_recall_backfill_min_support: 3
ebm_auto_threshold_from_ckpt: false

two_stage: false
seed_keep_thr: 0.25
seed_sources: raw
fill_keep_thr: 0.25
min_dt_support: 2
dt_cell_size: 1.0
min_dist_to_seed: 0.8
max_fill: 320

write_mode: add
det_key: det
refined_key: det_refined
write_fields: boxes_3d,labels_3d,scores_3d,attrs,sources
indent: 2

dump_repl_map: null

